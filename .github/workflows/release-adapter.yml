# INACTIVE REVIEW TEMPLATE. Activation on public protected main and exact 1.1.0
# publication require separate owner approval. Never install in private CI.
name: Publish reviewed adapter
on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact owner-reviewed public source commit
        required: true
        type: string
      reviewed_tarball_sha256:
        description: Exact SHA256 of the reviewed tarball
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: intake-adapter-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
      - name: Credential-free toolchain, install, tests and exact artifact preparation
        shell: bash
        run: |
          set -euo pipefail
          preparation=$(mktemp -d)
          trap 'rm -rf -- "$preparation"' EXIT
          mkdir "$preparation/home" "$preparation/cache" "$preparation/tmp"
          touch "$preparation/user.npmrc" "$preparation/global.npmrc"
          env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" \
            HOME="$preparation/home" TMPDIR="$preparation/tmp" LANG=C.UTF-8 \
            NPM_CONFIG_USERCONFIG="$preparation/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$preparation/global.npmrc" \
            NPM_CONFIG_CACHE="$preparation/cache" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_FETCH_RETRIES=0 \
            NPM_CONFIG_FETCH_TIMEOUT=30000 NPM_CONFIG_LOGS_MAX=0 \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false \
            NPM_CONFIG_UPDATE_NOTIFIER=false NPM_CONFIG_PROGRESS=false \
            bash --noprofile --norc -euo pipefail <<'PREPARE'
          npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.15.0
          test "$(node --version)" = v22.23.2
          test "$(npm --version)" = 11.15.0
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          node scripts/run-adapter-tests.js
          node scripts/prepare-adapter-package.js --output reviewed-artifact
          PREPARE
      - name: Transfer only the reviewed tarball
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-adapter-tarball
          path: reviewed-artifact/tech-adventures-llc-intake-site-adapter-1.1.0.tgz
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          include-hidden-files: false
          archive: true
  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    # OIDC permission applies to the entire protected job. These pinned bootstrap
    # actions and the toolchain shell are trusted with that job capability.
    # Dependency install, adapter tests and artifact construction occur only in
    # prepare, whose permissions do not include id-token.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
      - name: Install exact npm with scrubbed child environment
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(mktemp -d)
          trap 'rm -rf -- "$toolchain"' EXIT
          mkdir "$toolchain/home" "$toolchain/cache" "$toolchain/tmp"
          touch "$toolchain/user.npmrc" "$toolchain/global.npmrc"
          env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" \
            HOME="$toolchain/home" TMPDIR="$toolchain/tmp" LANG=C.UTF-8 \
            NPM_CONFIG_USERCONFIG="$toolchain/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$toolchain/global.npmrc" \
            NPM_CONFIG_CACHE="$toolchain/cache" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_FETCH_RETRIES=0 \
            NPM_CONFIG_FETCH_TIMEOUT=30000 NPM_CONFIG_LOGS_MAX=0 \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false \
            NPM_CONFIG_UPDATE_NOTIFIER=false NPM_CONFIG_PROGRESS=false \
            bash --noprofile --norc -euo pipefail <<'TOOLCHAIN'
          npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.15.0
          test "$(node --version)" = v22.23.2
          test "$(npm --version)" = 11.15.0
          TOOLCHAIN
      - name: Download the exact artifact from this preparation job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: reviewed-artifact
          digest-mismatch: error
      - name: Reverify and publish the exact reviewed tarball once through OIDC
        env:
          REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          REVIEWED_TARBALL_SHA256: ${{ inputs.reviewed_tarball_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-adapter.js reviewed-artifact/tech-adventures-llc-intake-site-adapter-1.1.0.tgz
      # The runner performs the real preflight, validates hosted provenance
      # context, and rechecks the isolated exact bytes immediately before its sole
      # npm child. A failed/ambiguous command must be reconciled separately:
      # no automatic retry, staged path or tag cleanup. Command success is not
      # registry integrity/provenance or site proof.
